    - any-glob-to-any-file:
        - 'AGENTS.md'
        - 'CLAUDE.md'
        - 'CONTEXT.md'
        - '.gemini/**'
        - 'skills/**'

area/docs:
  - changed-files:
    - any-glob-to-any-file:
        - 'docs/**'
        - 'README.md'
        - 'CONTRIBUTING.md'

area/ci:
  - changed-files:
    - any-glob-to-any-file: '.github/**'
